name: Provision & deploy JS Control platform (bot + D1)
# Manual only: run from the Actions tab after the one-time setup below.
#
# One-time setup you do first (see docs/SAAS-ACCESS.md → "Запуск бота"):
#   1. @BotFather: create a bot → copy its token and @username.
#   2. Cloudflare dashboard → Workers & Pages → D1 → create "js-control-platform"
#      → copy the database id. Put it in platform/wrangler.jsonc and
#      cloud-collector/wrangler.jsonc (Claude does this commit for you).
#   3. @userinfobot: copy your numeric Telegram id.
#   4. Repository → Settings → Secrets and variables → Actions:
#        Secret  TELEGRAM_BOT_TOKEN = <token from BotFather>
#        (CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID already exist.)
#      Variables already live in platform/wrangler.jsonc (BOT_USERNAME, ADMIN_CHAT_IDS).
# Then run this workflow once with provision_secrets = true. Later deploys: false.
on:
  workflow_dispatch:
    inputs:
      provision_secrets:
        description: 'Generate MASTER_KEY + webhook secrets and set the bot token (true on the FIRST run only; false afterwards so MASTER_KEY never rotates).'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: js-control-platform-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets are set
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" || { echo "::error::Add the TELEGRAM_BOT_TOKEN repository secret first (Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Check the D1 id is wired in
        working-directory: platform
        run: |
          if grep -q 'REPLACE_AFTER_wrangler_d1_create' wrangler.jsonc; then
            echo "::error::platform/wrangler.jsonc still has the D1 placeholder. Set the real database id first."; exit 1; fi

      - name: Run the platform tests
        working-directory: platform
        run: npm test

      - name: Apply D1 migrations (remote)
        working-directory: platform
        run: npx --yes wrangler d1 migrations apply js-control-platform --remote

      - name: Provision secrets (first run only)
        if: ${{ inputs.provision_secrets }}
        working-directory: platform
        run: |
          set -euo pipefail
          # MASTER_KEY: generated here, printed nowhere, stored only as a Worker secret.
          printf '%s' "$(openssl rand -base64 32)" | npx --yes wrangler secret put MASTER_KEY
          # Webhook secret: reused below to register the Telegram webhook in this same run.
          WH="$(openssl rand -hex 24)"; echo "::add-mask::$WH"; echo "WEBHOOK_SECRET=$WH" >> "$GITHUB_ENV"
          printf '%s' "$WH" | npx --yes wrangler secret put TELEGRAM_WEBHOOK_SECRET
          printf '%s' "$(openssl rand -hex 24)" | npx --yes wrangler secret put BILLING_WEBHOOK_SECRET
          printf '%s' '${{ secrets.TELEGRAM_BOT_TOKEN }}' | npx --yes wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Deploy the platform worker
        working-directory: platform
        run: npx --yes wrangler deploy

      - name: Register the Telegram webhook (first run only)
        if: ${{ inputs.provision_secrets }}
        run: |
          set -euo pipefail
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=https://js-control-platform.kirill-kanash2013.workers.dev/telegram" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\",\"pre_checkout_query\"]"
          echo

      - name: Check the platform is live
        run: curl --fail --retry 5 --retry-delay 5 https://js-control-platform.kirill-kanash2013.workers.dev/health
