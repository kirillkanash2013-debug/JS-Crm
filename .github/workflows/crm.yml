name: CRM checks and Apps Script sync
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backup, push and verify CRM source
        run: node scripts/deploy.mjs
        env:
          CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
      - name: Upload sanitized execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clasp-run-output
          path: clasp-run-output.txt
          if-no-files-found: warn
          retention-days: 1
