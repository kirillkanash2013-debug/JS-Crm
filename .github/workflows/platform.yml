name: JS Control platform checks
on:
  push:
    branches: [claude-code, claude/saas-access]
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: for f in platform/src/*.mjs; do node --check "$f"; done
      - name: Test platform
        working-directory: platform
        run: npm test
